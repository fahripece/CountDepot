<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6442D6">
  <title>CountDepot Offline</title>
  <style>
    :root{font-family:Inter,Roboto,system-ui,sans-serif;color:#111827;background:#eef2f7}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{max-width:420px;background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:28px;box-shadow:0 24px 64px rgba(15,23,42,.16)}
    .mark{width:56px;height:56px;border-radius:16px;background:#6442d6;color:#fff;display:grid;place-items:center;font-weight:900;font-size:24px;margin-bottom:18px}
    h1{font-size:24px;line-height:1.15;margin:0 0 10px}
    p{margin:0;color:#64748b;line-height:1.55}
    button{margin-top:22px;width:100%;border:0;border-radius:12px;background:#6442d6;color:#fff;padding:12px 16px;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="mark">C</div>
    <h1>You are offline</h1>
    <p>CountDepot needs a connection for live inventory updates, reservations, checkout, and team activity.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
