name: Deploy CountDepot

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /home/countdepot/countdepot
          git pull origin main

      - name: Install dependencies
        run: |
          cd /home/countdepot/countdepot
          ./venv/bin/pip install -r requirements.txt --quiet

      - name: Reload app
        run: sudo systemctl reload countdepot
