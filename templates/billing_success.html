{% extends "base.html" %}
{% block title %}Subscribed · CountDepot{% endblock %}
{% block content %}
<div style="display:flex;align-items:center;justify-content:center;flex:1;padding:40px">
  <div style="text-align:center;max-width:420px">
    <div style="font-size:56px;margin-bottom:20px">🎉</div>
    <h1 style="font-size:24px;font-weight:700;margin-bottom:10px">You're subscribed!</h1>
    <p style="color:var(--muted);font-size:14px;margin-bottom:28px;line-height:1.6">
      Your subscription is now active. Full access has been restored.<br>
      A receipt has been sent to your email.
    </p>
    <a href="/" class="btn btn-primary" style="justify-content:center">Go to Inventory →</a>
    <div style="margin-top:14px">
      <a href="/billing" style="font-size:13px;color:var(--muted)">View billing details</a>
    </div>
  </div>
</div>
{% endblock %}
