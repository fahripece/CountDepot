{% extends "base.html" %}
{% block title %}Subscribed · CountDepot{% endblock %}
{% block content %}
<div style="display:flex;align-items:center;justify-content:center;flex:1;padding:40px">
  <div style="text-align:center;max-width:420px" id="success-box">
    <div style="font-size:56px;margin-bottom:20px" id="success-icon">⏳</div>
    <h1 style="font-size:24px;font-weight:700;margin-bottom:10px" id="success-title">Confirming your subscription…</h1>
    <p style="color:var(--muted);font-size:14px;margin-bottom:28px;line-height:1.6" id="success-msg">
      Please wait while we confirm your payment with Stripe.
    </p>
    <div id="success-actions" style="display:none">
      <a href="/" class="btn btn-primary" style="justify-content:center">Go to Inventory →</a>
      <div style="margin-top:14px">
        <a href="/billing" style="font-size:13px;color:var(--muted)">View billing details</a>
      </div>
    </div>
  </div>
</div>
<script>
(async function poll() {
  for (let i = 0; i < 12; i++) {
    await new Promise(r => setTimeout(r, 2500));
    try {
      const res = await fetch('/api/billing/status');
      const d   = await res.json();
      if (d.status === 'active') {
        document.getElementById('success-icon').textContent  = '🎉';
        document.getElementById('success-title').textContent = "You're subscribed!";
        document.getElementById('success-msg').innerHTML     =
          'Your subscription is now active. Full access has been restored.<br>A receipt has been sent to your email.';
        document.getElementById('success-actions').style.display = 'block';
        return;
      }
    } catch(e) {}
  }
  // Timeout — tell them to check billing page
  document.getElementById('success-icon').textContent  = '✅';
  document.getElementById('success-title').textContent = 'Payment received';
  document.getElementById('success-msg').textContent   =
    'Your payment was received. It may take a moment to reflect — check the billing page if access is not restored shortly.';
  document.getElementById('success-actions').style.display = 'block';
})();
</script>
{% endblock %}
