{% extends "base.html" %}
{% block title %}Spend Analytics · CountDepot{% endblock %}
{% block content %}
<div class="topbar">
  <a href="/procurement" style="color:#64748b;text-decoration:none;font-size:13px;display:flex;align-items:center;gap:4px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>Purchase Orders
  </a>
  <span style="color:#cbd5e1;margin:0 6px">/</span>
  <span class="topbar-title">Spend Analytics</span>
  <div class="topbar-right" style="display:flex;align-items:center;gap:8px">
    <select id="periodSel" class="select" style="width:auto;min-width:140px" onchange="onPeriodChange()">
      <option value="">All Time</option>
      <option value="month">This Month</option>
      <option value="quarter">This Quarter</option>
      <option value="year">This Year</option>
      <option value="last30">Last 30 Days</option>
      <option value="custom">Custom Range</option>
    </select>
    <div id="customRange" style="display:none;gap:6px;align-items:center">
      <input type="date" id="dateFrom" class="input" style="width:auto">
      <span style="color:#94a3b8">to</span>
      <input type="date" id="dateTo" class="input" style="width:auto">
      <button class="btn btn-primary btn-sm" onclick="loadAnalytics()">Apply</button>
    </div>
    <button class="btn btn-secondary btn-sm" onclick="openBudgetModal()">Set Monthly Budget</button>
  </div>
</div>

<div style="flex:1;overflow-y:auto;padding:20px 24px" id="analyticsContent">
  <div style="text-align:center;padding:60px;color:#94a3b8">Loading…</div>
</div>

<!-- Budget modal -->
<div id="budgetModal" class="modal-backdrop" style="display:none" onclick="if(event.target===this)closeBudgetModal()">
  <div class="modal-box" style="width:380px">
    <div class="modal-head">
      <span class="modal-title">Monthly PO Budget</span>
      <button class="modal-close" onclick="closeBudgetModal()">×</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:#475569;margin-bottom:14px;line-height:1.6">Set a monthly budget target for purchase orders. Used to track budget vs actual spend.</p>
      <div class="form-row">
        <label class="form-label">Monthly Budget ($)</label>
        <input id="budget-input" class="input" type="number" min="0" step="100" placeholder="e.g. 50000">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeBudgetModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveBudget()">Save</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
.rpt-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px}
.rpt-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.kcard{background:#fff;border:1px solid #e5e3de;border-radius:10px;padding:18px 20px}
.kcard-l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:#94a3b8;margin-bottom:8px}
.kcard-v{font-size:26px;font-weight:700;font-family:'IBM Plex Mono',monospace;letter-spacing:-1px;line-height:1}
.kcard-sub{font-size:12px;color:#94a3b8;margin-top:5px}
.chart-card{background:#fff;border:1px solid #e5e3de;border-radius:10px;padding:18px 20px}
.chart-title{font-size:13px;font-weight:600;color:#0f172a;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{padding:8px 12px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:#94a3b8;border-bottom:1px solid #e5e3de;white-space:nowrap}
.data-table td{padding:9px 12px;border-bottom:1px solid #f5f4f1;vertical-align:middle}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table tbody tr:hover td{background:#fafaf8}
.bar-bg{background:#f1f5f9;border-radius:4px;height:6px;overflow:hidden;min-width:60px;flex:1}
.bar-fill{height:100%;border-radius:4px;background:#1d4ed8;transition:width .3s}
.form-row{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:5px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9000}
.modal-box{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #e5e3de}
.modal-title{font-size:15px;font-weight:700;color:#0f172a}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#94a3b8;line-height:1;padding:0 2px}
.modal-body{padding:20px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid #e5e3de;background:#fafaf8}
@media(max-width:1050px){.rpt-grid{grid-template-columns:repeat(3,1fr)}.rpt-grid-2{grid-template-columns:1fr}}
</style>
<script>
let analyticsCharts = {};
let monthlyBudget = 0;

function fmt$(n){return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtK(n){
  n = Number(n||0);
  if(n >= 1000000) return '$'+(n/1000000).toFixed(1)+'M';
  if(n >= 1000)    return '$'+(n/1000).toFixed(1)+'K';
  return fmt$(n);
}

function onPeriodChange(){
  const v = document.getElementById('periodSel').value;
  document.getElementById('customRange').style.display = v==='custom' ? 'flex' : 'none';
  if(v !== 'custom') loadAnalytics();
}

function getParams(){
  const p = document.getElementById('periodSel').value;
  const params = new URLSearchParams();
  if(p) params.set('period', p);
  if(p === 'custom'){
    params.set('from', document.getElementById('dateFrom').value);
    params.set('to',   document.getElementById('dateTo').value);
  }
  return params;
}

async function loadAnalytics(){
  document.getElementById('analyticsContent').innerHTML =
    '<div style="text-align:center;padding:60px;color:#94a3b8">Loading…</div>';
  const data = await fetch('/api/procurement/analytics?' + getParams()).then(r=>r.json());
  if(!data.ok){ document.getElementById('analyticsContent').innerHTML='<p style="color:#b91c1c;padding:40px">Error loading analytics.</p>'; return; }
  monthlyBudget = data.monthly_budget || 0;
  Object.values(analyticsCharts).forEach(c=>{try{c.destroy()}catch(e){}});
  analyticsCharts = {};
  renderAnalytics(data);
}

function renderAnalytics(data){
  const k = data.kpi;
  const budgetHtml = monthlyBudget > 0 ? buildBudgetBar(k.this_month, monthlyBudget) : '';
  const pLabel = data.period.from ? (data.period.from + ' → ' + data.period.to) : 'All Time';

  document.getElementById('analyticsContent').innerHTML = `
  <div class="rpt-grid">
    <div class="kcard"><div class="kcard-l">Total Spend</div><div class="kcard-v">${fmtK(k.total_spend)}</div><div class="kcard-sub">${k.po_count} purchase order${k.po_count!==1?'s':''}</div></div>
    <div class="kcard"><div class="kcard-l">This Month</div><div class="kcard-v" style="color:${monthlyBudget && k.this_month > monthlyBudget ? '#b91c1c' : '#0f172a'}">${fmtK(k.this_month)}</div><div class="kcard-sub">${monthlyBudget?'Budget: '+fmtK(monthlyBudget):pLabel}</div></div>
    <div class="kcard"><div class="kcard-l">Avg PO Value</div><div class="kcard-v">${fmtK(k.avg_po_value)}</div></div>
    <div class="kcard"><div class="kcard-l">Open / Pending</div><div class="kcard-v" style="color:#d97706">${fmtK(k.open_value)}</div><div class="kcard-sub">Draft + In Transit</div></div>
    <div class="kcard"><div class="kcard-l">Budget Used</div>${monthlyBudget ? `<div class="kcard-v" style="color:${k.this_month/monthlyBudget>1?'#b91c1c':'#15803d'}">${Math.round(k.this_month/monthlyBudget*100)}%</div><div class="kcard-sub">${fmtK(k.this_month)} of ${fmtK(monthlyBudget)}</div>` : '<div style="font-size:13px;color:#94a3b8;margin-top:6px">No budget set</div>'}</div>
  </div>
  ${budgetHtml}
  <div class="rpt-grid-2">
    <div class="chart-card">
      <div class="chart-title">Monthly Spend Trend</div>
      ${data.by_month.length ? '<canvas id="monthChart" height="200"></canvas>' : '<div style="color:#94a3b8;font-size:13px;padding:20px 0">No data yet — spend shows after POs are sent.</div>'}
    </div>
    <div class="chart-card">
      <div class="chart-title">Spend by Vendor</div>
      ${data.by_vendor.length ? '<canvas id="vendorChart" height="200"></canvas>' : '<div style="color:#94a3b8;font-size:13px;padding:20px 0">No vendor spend data yet.</div>'}
    </div>
  </div>
  <div class="rpt-grid-2">
    <div class="chart-card">
      <div class="chart-title">Vendor Breakdown</div>
      ${renderVendorTable(data.by_vendor)}
    </div>
    <div class="chart-card">
      <div class="chart-title">Top Line Items by Spend</div>
      ${renderItemsTable(data.top_items)}
    </div>
  </div>`;

  // Month chart
  if(data.by_month.length){
    const ctx = document.getElementById('monthChart').getContext('2d');
    analyticsCharts.month = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: data.by_month.map(r => r.month),
        datasets: [{
          label: 'Spend',
          data: data.by_month.map(r => r.total_spend || 0),
          backgroundColor: '#3b82f6',
          borderRadius: 4,
        }, ...(monthlyBudget ? [{
          type: 'line',
          label: 'Budget',
          data: data.by_month.map(() => monthlyBudget),
          borderColor: '#f59e0b',
          borderDash: [5,5],
          borderWidth: 2,
          pointRadius: 0,
          fill: false,
        }] : [])],
      },
      options: {
        responsive: true,
        plugins: { legend: { display: monthlyBudget > 0 } },
        scales: {
          y: { beginAtZero: true, ticks: { callback: v => fmtK(v) } },
          x: { grid: { display: false } },
        },
      },
    });
  }

  // Vendor pie chart
  if(data.by_vendor.length){
    const ctx2 = document.getElementById('vendorChart').getContext('2d');
    const palette = ['#3b82f6','#8b5cf6','#ec4899','#f59e0b','#10b981',
                     '#6366f1','#ef4444','#14b8a6','#f97316','#84cc16'];
    analyticsCharts.vendor = new Chart(ctx2, {
      type: 'doughnut',
      data: {
        labels: data.by_vendor.map(r => r.vendor_name),
        datasets: [{
          data: data.by_vendor.map(r => r.total_spend || 0),
          backgroundColor: palette,
          borderWidth: 2,
          borderColor: '#fff',
        }],
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } },
          tooltip: { callbacks: { label: ctx => ctx.label + ': ' + fmtK(ctx.parsed) } },
        },
      },
    });
  }
}

function buildBudgetBar(spent, budget){
  const pct = Math.min(spent / budget * 100, 100);
  const over = spent > budget;
  return `<div style="background:#fff;border:1px solid #e5e3de;border-radius:10px;padding:14px 20px;margin-bottom:20px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-size:12px;font-weight:600;color:#475569">Monthly Budget — ${new Date().toLocaleString('default',{month:'long',year:'numeric'})}</span>
      <span style="font-size:12px;color:${over?'#b91c1c':'#64748b'}">${fmt$(spent)} / ${fmt$(budget)}${over?' <strong>OVER BUDGET</strong>':''}</span>
    </div>
    <div style="background:#f1f5f9;border-radius:6px;height:8px;overflow:hidden">
      <div style="height:100%;border-radius:6px;background:${over?'#b91c1c':'#1d4ed8'};width:${pct.toFixed(1)}%;transition:width .5s"></div>
    </div>
  </div>`;
}

function renderVendorTable(rows){
  if(!rows.length) return '<div style="color:#94a3b8;font-size:13px;padding:12px 0">No data.</div>';
  const maxSpend = Math.max(...rows.map(r=>r.total_spend||0));
  return `<table class="data-table">
    <thead><tr><th>Vendor</th><th style="text-align:center">POs</th><th style="text-align:right">Spend</th><th style="text-align:right">%</th></tr></thead>
    <tbody>
      ${rows.map(r=>`<tr>
        <td>
          <div style="font-weight:500">${r.vendor_name}</div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:4px">
            <div class="bar-bg"><div class="bar-fill" style="width:${maxSpend?((r.total_spend||0)/maxSpend*100).toFixed(1):0}%"></div></div>
          </div>
        </td>
        <td style="text-align:center;color:#64748b">${r.po_count}</td>
        <td style="text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:600">${fmt$(r.total_spend)}</td>
        <td style="text-align:right;color:#64748b">${r.percent}%</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

function renderItemsTable(rows){
  if(!rows.length) return '<div style="color:#94a3b8;font-size:13px;padding:12px 0">No data.</div>';
  return `<table class="data-table">
    <thead><tr><th>Description</th><th style="text-align:center">Qty</th><th style="text-align:right">Total</th><th style="text-align:right">Avg Price</th></tr></thead>
    <tbody>
      ${rows.map(r=>`<tr>
        <td style="font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.description}">${r.description}</td>
        <td style="text-align:center;color:#64748b">${r.total_qty||0}</td>
        <td style="text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:600">${fmt$(r.total_spend)}</td>
        <td style="text-align:right;font-family:'IBM Plex Mono',monospace;color:#64748b">${fmt$(r.avg_unit_cost)}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

// ── Budget modal ──────────────────────────────────────────────────────────────
function openBudgetModal(){
  document.getElementById('budget-input').value = monthlyBudget || '';
  document.getElementById('budgetModal').style.display = 'flex';
}
function closeBudgetModal(){ document.getElementById('budgetModal').style.display = 'none'; }
async function saveBudget(){
  const val = parseFloat(document.getElementById('budget-input').value) || 0;
  const headers = {'Content-Type':'application/json'};
  const csrf = document.cookie.match(/csrf_token=([^;]+)/);
  if(csrf) headers['X-CSRF-Token'] = decodeURIComponent(csrf[1]);
  const r = await fetch('/api/procurement/analytics/budget', {
    method: 'POST', headers, body: JSON.stringify({monthly_budget: val})
  }).then(x=>x.json());
  if(!r.ok){ alert(r.msg||'Error'); return; }
  closeBudgetModal();
  loadAnalytics();
}

loadAnalytics();
</script>
{% endblock %}
