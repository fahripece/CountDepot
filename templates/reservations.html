{% extends "base.html" %}
{% block title %}Reservations · CountDepot{% endblock %}
{% block content %}
<div class="topbar">
  <span class="topbar-title">Reservations</span>
  <span class="topbar-sub">Book items in advance</span>
  <div class="topbar-right">
    <button class="btn btn-primary btn-sm" onclick="openNewReservation()">+ New Reservation</button>
  </div>
</div>

<div style="flex:1;overflow-y:auto;padding:20px 24px">

<!-- Stat tiles -->
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px">
  <div class="stat"><div class="stat-l">Upcoming</div><div class="stat-v" id="stUpcoming">—</div></div>
  <div class="stat"><div class="stat-l">Active today</div><div class="stat-v" id="stToday">—</div></div>
  <div class="stat"><div class="stat-l">Items reserved</div><div class="stat-v" id="stItems">—</div></div>
</div>

<!-- Filter bar -->
<div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
  <input class="input" id="searchRes" placeholder="Search by item or person…" style="max-width:260px" oninput="filterReservations()">
  <input type="date" class="input" id="filterFrom" style="max-width:160px" onchange="loadReservations()">
  <input type="date" class="input" id="filterTo"   style="max-width:160px" onchange="loadReservations()">
  <button class="btn btn-secondary btn-sm" onclick="clearFilters()">Clear</button>
</div>

<!-- Table -->
<div class="table-wrap">
  <table style="width:100%;border-collapse:collapse">
    <thead>
      <tr>
        <th style="text-align:left;padding:10px 14px;font-size:11px;color:#94a3b8;font-weight:600;border-bottom:1px solid #f0ede8">Item</th>
        <th style="text-align:left;padding:10px 14px;font-size:11px;color:#94a3b8;font-weight:600;border-bottom:1px solid #f0ede8">Reserved By</th>
        <th style="text-align:left;padding:10px 14px;font-size:11px;color:#94a3b8;font-weight:600;border-bottom:1px solid #f0ede8">From</th>
        <th style="text-align:left;padding:10px 14px;font-size:11px;color:#94a3b8;font-weight:600;border-bottom:1px solid #f0ede8">To</th>
        <th style="text-align:left;padding:10px 14px;font-size:11px;color:#94a3b8;font-weight:600;border-bottom:1px solid #f0ede8">Status</th>
        <th style="text-align:left;padding:10px 14px;font-size:11px;color:#94a3b8;font-weight:600;border-bottom:1px solid #f0ede8">Notes</th>
        <th style="padding:10px 14px;font-size:11px;border-bottom:1px solid #f0ede8"></th>
      </tr>
    </thead>
    <tbody id="resTable"><tr><td colspan="7" style="padding:24px;text-align:center;color:#94a3b8;font-size:13px">Loading…</td></tr></tbody>
  </table>
</div>

</div>

<!-- New Reservation Modal -->
<div class="overlay" id="newResModal">
  <div class="modal" style="width:480px">
    <div class="modal-header">
      <div class="modal-title">New Reservation</div>
      <button class="modal-close" onclick="closeModal('newResModal')">✕</button>
    </div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:14px">
      <div class="field">
        <label class="label">Item *</label>
        <select class="select" id="resItemId" onchange="loadAvailability()">
          <option value="">Select an item…</option>
          {% for i in items %}
          <option value="{{ i.id }}">{{ i.name }}{% if i.serial %} · {{ i.serial }}{% elif i.sku %} · {{ i.sku }}{% elif i.internal_sku %} · {{ i.internal_sku }}{% endif %}</option>
          {% endfor %}
        </select>
      </div>
      <div id="availabilityNote" style="display:none;background:#fef9f0;border:1px solid #fde68a;border-radius:7px;padding:10px 12px;font-size:12px;color:#92400e"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field">
          <label class="label">From *</label>
          <input type="date" class="input" id="resStart">
        </div>
        <div class="field">
          <label class="label">To *</label>
          <input type="date" class="input" id="resEnd">
        </div>
      </div>
      <div class="field">
        <label class="label">Reserved By *</label>
        <input class="input" id="resBy" placeholder="Name or department">
      </div>
      <div class="field">
        <label class="label">Notes</label>
        <textarea class="input" id="resNotes" rows="2" placeholder="Purpose, project, etc."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('newResModal')">Cancel</button>
      <button class="btn btn-primary" onclick="submitReservation()">Reserve</button>
    </div>
  </div>
</div>

<script>
const today = new Date().toISOString().slice(0,10);
let allRes=[];

async function api(url,body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':document.querySelector('meta[name=csrf-token]').content},body:JSON.stringify(body)});
  return r.json();
}

function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}

function statusBadge(s){
  const map={confirmed:'background:#dbeafe;color:#1d4ed8',active:'background:#dcfce7;color:#15803d',completed:'background:#f1f5f9;color:#64748b',cancelled:'background:#fee2e2;color:#b91c1c'};
  return `<span style="font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:4px;${map[s]||''}">${s}</span>`;
}

async function loadReservations(){
  const from=document.getElementById('filterFrom').value;
  const to=document.getElementById('filterTo').value;
  let url='/api/reservations?';
  if(from)url+=`from=${from}&`;
  if(to)url+=`to=${to}&`;
  const d=await fetch(url).then(r=>r.json());
  allRes=d.reservations||[];
  renderTable(allRes);
  // Stats
  const t=today;
  document.getElementById('stUpcoming').textContent=allRes.filter(r=>r.start_date>t).length;
  document.getElementById('stToday').textContent=allRes.filter(r=>r.start_date<=t&&r.end_date>=t).length;
  document.getElementById('stItems').textContent=new Set(allRes.map(r=>r.item_id)).size;
}

function renderTable(rows){
  const tb=document.getElementById('resTable');
  if(!rows.length){tb.innerHTML='<tr><td colspan="7" style="padding:24px;text-align:center;color:#94a3b8;font-size:13px">No reservations found</td></tr>';return;}
  tb.innerHTML=rows.map(r=>{
    const dot=r.color?`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${r.color};margin-right:5px"></span>`:'';
    const id_line=r.serial?`<span style="font-size:10px;color:#94a3b8;margin-left:4px">SN: ${r.serial}</span>`:r.sku?`<span style="font-size:10px;color:#94a3b8;margin-left:4px">${r.sku}</span>`:'';
    return `<tr style="border-bottom:1px solid #f0ede8">
      <td style="padding:10px 14px;font-size:13px">${dot}<strong>${r.item_name}</strong>${id_line}</td>
      <td style="padding:10px 14px;font-size:13px">${r.reserved_by}</td>
      <td style="padding:10px 14px;font-size:13px;font-family:monospace">${r.start_date}</td>
      <td style="padding:10px 14px;font-size:13px;font-family:monospace">${r.end_date}</td>
      <td style="padding:10px 14px">${statusBadge(r.status)}</td>
      <td style="padding:10px 14px;font-size:12px;color:#64748b;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.notes||''}</td>
      <td style="padding:10px 14px;text-align:right">
        ${r.status!=='cancelled'?`<button onclick="cancelReservation(${r.id})" style="font-size:11px;color:#b91c1c;background:none;border:none;cursor:pointer">Cancel</button>`:''}
      </td>
    </tr>`;
  }).join('');
}

function filterReservations(){
  const q=document.getElementById('searchRes').value.toLowerCase();
  renderTable(q?allRes.filter(r=>(r.item_name||'').toLowerCase().includes(q)||(r.reserved_by||'').toLowerCase().includes(q)):allRes);
}

function clearFilters(){
  document.getElementById('filterFrom').value='';
  document.getElementById('filterTo').value='';
  document.getElementById('searchRes').value='';
  loadReservations();
}

function openNewReservation(){
  document.getElementById('resItemId').value='';
  document.getElementById('resStart').value=today;
  document.getElementById('resEnd').value=today;
  document.getElementById('resBy').value='';
  document.getElementById('resNotes').value='';
  document.getElementById('availabilityNote').style.display='none';
  openModal('newResModal');
}

async function loadAvailability(){
  const id=document.getElementById('resItemId').value;
  const note=document.getElementById('availabilityNote');
  if(!id){note.style.display='none';return;}
  const d=await fetch(`/api/reservations/availability?item_id=${id}`).then(r=>r.json());
  if(d.booked&&d.booked.length){
    note.style.display='block';
    note.innerHTML='<strong>Already reserved:</strong> '+d.booked.map(b=>`${b.start_date} → ${b.end_date} (${b.reserved_by})`).join(', ');
  }else{
    note.style.display='block';note.style.background='#f0fdf4';note.style.borderColor='#bbf7d0';note.style.color='#15803d';
    note.textContent='Item is available — no existing reservations.';
  }
}

async function submitReservation(){
  const item_id=document.getElementById('resItemId').value;
  const start=document.getElementById('resStart').value;
  const end=document.getElementById('resEnd').value;
  const by=document.getElementById('resBy').value.trim();
  const notes=document.getElementById('resNotes').value.trim();
  if(!item_id||!start||!end||!by){alert('Please fill in all required fields.');return;}
  const r=await api('/api/reservations',{item_id:parseInt(item_id),start_date:start,end_date:end,reserved_by:by,notes});
  if(r.ok){closeModal('newResModal');loadReservations();}
  else alert(r.msg||'Could not create reservation');
}

async function cancelReservation(id){
  if(!confirm('Cancel this reservation?'))return;
  const r=await api(`/api/reservations/${id}/cancel`,{});
  if(r.ok)loadReservations();
  else alert(r.msg||'Could not cancel');
}

// Set default date range to next 30 days
document.getElementById('filterFrom').value=today;
const d30=new Date();d30.setDate(d30.getDate()+30);
document.getElementById('filterTo').value=d30.toISOString().slice(0,10);
loadReservations();
</script>
{% endblock %}
