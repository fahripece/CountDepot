{% extends "base.html" %}
{% block title %}Location Report · CountDepot{% endblock %}
{% block content %}
<div class="topbar">
  <span class="topbar-title">Location Report</span>
  <span class="topbar-sub">Inventory grouped by location</span>
  <div class="topbar-right">
    <button class="btn btn-secondary btn-sm" onclick="window.print()">🖨 Print / PDF</button>
    <button class="btn btn-secondary btn-sm" onclick="load()">↻ Refresh</button>
  </div>
</div>

<div style="flex:1;overflow-y:auto;padding:20px 24px" id="pageContent">
  <div style="text-align:center;padding:60px;color:#94a3b8">Loading…</div>
</div>

<style>
.loc-card{background:#fff;border:1px solid #e5e3de;border-radius:10px;margin-bottom:16px;overflow:hidden}
.loc-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;user-select:none}
.loc-hdr:hover{background:#fafaf9}
.loc-body{padding:0 18px 14px;display:none}
.loc-body.open{display:block}
.loc-item-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f5f4f1;font-size:13px}
.loc-item-row:last-child{border-bottom:none}
@media print{
  .sidebar,.topbar-right{display:none!important}
  .loc-body{display:block!important}
}
</style>
<script>
async function load(){
  const el=document.getElementById('pageContent');
  el.innerHTML='<div style="text-align:center;padding:60px;color:#94a3b8">Loading…</div>';
  const data=await fetch('/api/report/locations').then(r=>r.json());
  if(!data.ok){el.innerHTML='<div style="color:#b91c1c;padding:20px">Error loading data</div>';return;}
  const locs=data.locations;
  const totalItems=locs.reduce((s,l)=>s+l.total,0);
  const totalOut=locs.reduce((s,l)=>s+l.checked_out,0);
  let html=`
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px">
    <div class="card" style="padding:14px 18px">
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:#94a3b8;margin-bottom:6px">Locations</div>
      <div style="font-size:26px;font-weight:700;font-family:'IBM Plex Mono',monospace">${locs.filter(l=>l.id!=null).length}</div>
    </div>
    <div class="card" style="padding:14px 18px">
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:#94a3b8;margin-bottom:6px">Total Items</div>
      <div style="font-size:26px;font-weight:700;font-family:'IBM Plex Mono',monospace">${totalItems}</div>
    </div>
    <div class="card" style="padding:14px 18px">
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:#94a3b8;margin-bottom:6px">Checked Out</div>
      <div style="font-size:26px;font-weight:700;font-family:'IBM Plex Mono',monospace;color:${totalOut>0?'#b91c1c':'#94a3b8'}">${totalOut}</div>
    </div>
  </div>`;
  locs.forEach((loc,i)=>{
    if(!loc.total)return; // skip empty locations
    const overdueCount=loc.items.filter(it=>it.overdue).length;
    html+=`<div class="loc-card">
      <div class="loc-hdr" onclick="toggleLoc(${i})">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:10px;height:10px;border-radius:50%;background:${loc.id?'#1d4ed8':'#94a3b8'}"></div>
          <div>
            <div style="font-weight:600;font-size:14px">${esc(loc.name)}</div>
            ${loc.description?`<div style="font-size:12px;color:#94a3b8;margin-top:1px">${esc(loc.description)}</div>`:''}
          </div>
        </div>
        <div style="display:flex;gap:12px;align-items:center">
          ${overdueCount?`<span style="font-size:12px;font-weight:600;color:#b91c1c">⚠ ${overdueCount} overdue</span>`:''}
          <span style="font-size:12px;color:#94a3b8">${loc.checked_out} out / ${loc.total} total</span>
          <span style="font-size:12px;color:#64748b" id="loc-toggle-${i}">▸ Show items</span>
        </div>
      </div>
      <div class="loc-body" id="loc-body-${i}">
        ${loc.items.map(it=>{
          const id_str=it.serial||it.sku||it.internal_sku||'';
          const overdue=it.overdue;
          return `<div class="loc-item-row" style="${overdue?'background:#fef9f9;border-radius:6px;padding:8px;':''}">
            <span style="color:${it.color||'#94a3b8'};font-size:10px;font-weight:700;background:${it.color||'#f0efec'}18;padding:2px 7px;border-radius:4px">${esc(it.category||'—')}</span>
            <span style="flex:1;font-weight:500">${esc(it.name)}</span>
            ${id_str?`<span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#64748b">${esc(id_str)}</span>`:''}
            <span style="font-size:11px;color:#64748b">${it.condition||''}</span>
            ${it.checked_out
              ? `<span style="font-size:11px;font-weight:600;color:${overdue?'#b91c1c':'#b45309'}">📤 ${esc(it.checkout_by||'out')}${overdue?' OVERDUE':''}</span>`
              : `<span style="font-size:11px;color:#15803d">✓ In</span>`}
            ${it.cost_price!=null?`<span style="font-size:11px;color:#94a3b8">$${parseFloat(it.cost_price).toFixed(2)}</span>`:''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  });
  el.innerHTML=html;
  // Auto-open locations with ≤10 items
  locs.forEach((loc,i)=>{if(loc.total&&loc.total<=10)toggleLoc(i,true);});
}

function toggleLoc(i,forceOpen){
  const body=document.getElementById('loc-body-'+i);
  const tog=document.getElementById('loc-toggle-'+i);
  if(!body)return;
  const open=forceOpen!==undefined?forceOpen:!body.classList.contains('open');
  body.classList.toggle('open',open);
  if(tog)tog.textContent=open?'▾ Hide items':'▸ Show items';
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
load();
</script>
{% endblock %}
