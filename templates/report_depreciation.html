{% extends "base.html" %}
{% block title %}Depreciation Report · CountDepot{% endblock %}
{% block content %}
<div class="topbar">
  <span class="topbar-title">Depreciation Report</span>
  <span class="topbar-sub" id="topbar-sub">Current book value per asset</span>
  <div class="topbar-right">
    <button class="btn btn-secondary btn-sm" onclick="exportCsv()">↓ Export CSV</button>
    <button class="btn btn-secondary btn-sm" onclick="window.print()">🖨 Print / PDF</button>
    <button class="btn btn-secondary btn-sm" onclick="load()">↻ Refresh</button>
  </div>
</div>

<div style="flex:1;overflow-y:auto;padding:20px 24px" id="pageContent">
  <div style="text-align:center;padding:60px;color:#94a3b8">Loading…</div>
</div>

<style>
.dep-kpi{background:#fff;border:1px solid #e5e3de;border-radius:10px;padding:16px 20px;text-align:center}
.dep-kpi-v{font-size:26px;font-weight:700;color:#0f172a;line-height:1}
.dep-kpi-l{font-size:11px;color:#94a3b8;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.dep-th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#94a3b8;font-weight:600;padding:8px 12px;border-bottom:2px solid #e5e3de;text-align:left;white-space:nowrap}
.dep-td{padding:9px 12px;border-bottom:1px solid #f5f4f1;font-size:13px;vertical-align:middle}
.dep-tr:hover .dep-td{background:#fafaf9}
.dep-bar-wrap{background:#f1f5f9;border-radius:4px;height:6px;min-width:60px;overflow:hidden}
.dep-bar{height:6px;border-radius:4px;background:#1d4ed8}
@media print{.sidebar,.topbar-right{display:none!important}}
</style>
<script>
let _depData=null;
function fmt(v){return v!=null?'$'+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):'—';}
function pct(cur,orig){if(!orig||orig===0)return 0;return Math.min(100,Math.max(0,(cur/orig)*100));}

async function load(){
  const el=document.getElementById('pageContent');
  el.innerHTML='<div style="text-align:center;padding:60px;color:#94a3b8">Loading…</div>';
  const data=await fetch('/api/report/depreciation').then(r=>r.json()).catch(()=>({ok:false}));
  if(!data.ok){el.innerHTML='<div style="color:#b91c1c;padding:20px">Error loading data</div>';return;}
  _depData=data;

  const t=data.totals;
  document.getElementById('topbar-sub').textContent=`${t.count} asset(s) with depreciation rate`;

  const retained=t.total_cost>0?Math.round((t.total_current/t.total_cost)*100):0;
  let html=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
    <div class="dep-kpi"><div class="dep-kpi-v">${t.count}</div><div class="dep-kpi-l">Assets</div></div>
    <div class="dep-kpi"><div class="dep-kpi-v">${fmt(t.total_cost)}</div><div class="dep-kpi-l">Original Cost</div></div>
    <div class="dep-kpi"><div class="dep-kpi-v" style="color:#1d4ed8">${fmt(t.total_current)}</div><div class="dep-kpi-l">Current Book Value</div></div>
    <div class="dep-kpi"><div class="dep-kpi-v" style="color:#b91c1c">${fmt(t.total_depreciated)}</div><div class="dep-kpi-l">Total Depreciated (${100-retained}% lost)</div></div>
  </div>`;

  if(!data.items.length){
    html+='<div style="text-align:center;padding:40px;color:#94a3b8;font-size:14px">No items have a depreciation rate set. Add one in the Edit Item → Advanced Options section.</div>';
    el.innerHTML=html;return;
  }

  html+=`<div style="background:#fff;border:1px solid #e5e3de;border-radius:10px;overflow:hidden">
  <table style="width:100%;border-collapse:collapse">
    <thead><tr>
      <th class="dep-th">Item</th>
      <th class="dep-th">Category</th>
      <th class="dep-th">Serial / SKU</th>
      <th class="dep-th" style="text-align:right">Original Cost</th>
      <th class="dep-th" style="text-align:right">Rate</th>
      <th class="dep-th" style="text-align:right">Age</th>
      <th class="dep-th" style="text-align:right">Current Value</th>
      <th class="dep-th" style="text-align:right">Depreciated</th>
      <th class="dep-th">Retained</th>
    </tr></thead>
    <tbody>`;
  data.items.forEach(i=>{
    const id=i.serial||i.sku||i.internal_sku||('ID-'+i.id);
    const p=pct(i.current_value,i.cost_price);
    html+=`<tr class="dep-tr">
      <td class="dep-td" style="font-weight:600">${i.name}</td>
      <td class="dep-td" style="font-size:12px;color:#64748b">${i.category||'—'}</td>
      <td class="dep-td"><span style="font-family:monospace;font-size:12px">${id}</span></td>
      <td class="dep-td" style="text-align:right">${fmt(i.cost_price)}</td>
      <td class="dep-td" style="text-align:right">${i.depreciation_rate}%/yr</td>
      <td class="dep-td" style="text-align:right;color:#64748b">${i.years_held}yr</td>
      <td class="dep-td" style="text-align:right;font-weight:600;color:#1d4ed8">${fmt(i.current_value)}</td>
      <td class="dep-td" style="text-align:right;color:#b91c1c">${fmt(i.total_depreciated)}</td>
      <td class="dep-td" style="min-width:80px">
        <div style="display:flex;align-items:center;gap:6px">
          <div class="dep-bar-wrap" style="flex:1"><div class="dep-bar" style="width:${p}%"></div></div>
          <span style="font-size:11px;color:#64748b;white-space:nowrap">${Math.round(p)}%</span>
        </div>
      </td>
    </tr>`;
  });
  html+='</tbody></table></div>';
  el.innerHTML=html;
}

function exportCsv(){
  if(!_depData||!_depData.items.length){toast('No data to export','warn');return;}
  const rows=[['Item','Category','Serial/SKU','Location','Original Cost','Rate(%/yr)','Age (yrs)','Current Value','Depreciated']];
  _depData.items.forEach(i=>{
    const id=i.serial||i.sku||i.internal_sku||('ID-'+i.id);
    rows.push([i.name,i.category||'',id,i.shelf||'',i.cost_price||'',i.depreciation_rate,i.years_held,i.current_value,i.total_depreciated]);
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='depreciation_report.csv';a.click();
}
load();
</script>
{% endblock %}
