{% extends "base.html" %}
{% block title %}Import History · CountDepot{% endblock %}
{% block content %}
<div class="topbar">
  <span class="topbar-title">Import History</span>
  <span class="topbar-sub">Record of every inventory and invoice import</span>
  <div class="topbar-right">
    <button class="btn btn-secondary btn-sm" onclick="window.print()">🖨 Print / PDF</button>
  </div>
</div>

<div style="flex:1;overflow-y:auto;padding:20px 24px">

<!-- Filters -->
<div class="card" style="margin-bottom:16px;padding:14px 18px">
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
    <div style="flex:1;min-width:160px">
      <label class="label">Vendor / Reference</label>
      <input class="input" id="f-vendor" placeholder="Search vendor or ref…" oninput="loadDebounced()">
    </div>
    <div style="flex:1;min-width:140px">
      <label class="label">Site</label>
      <input class="input" id="f-site" placeholder="Search site…" oninput="loadDebounced()">
    </div>
    <div style="min-width:130px">
      <label class="label">From date</label>
      <input class="input" id="f-from" type="date" onchange="load()">
    </div>
    <div style="min-width:130px">
      <label class="label">To date</label>
      <input class="input" id="f-to" type="date" onchange="load()">
    </div>
    <button class="btn btn-secondary btn-sm" onclick="clearFilters()" style="align-self:flex-end">Clear</button>
  </div>
</div>

<!-- Summary stats -->
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px">
  <div class="card" style="padding:14px 18px">
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:#94a3b8;margin-bottom:6px">Total Imports</div>
    <div style="font-size:26px;font-weight:700;font-family:'IBM Plex Mono',monospace" id="s-total">—</div>
  </div>
  <div class="card" style="padding:14px 18px">
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:#94a3b8;margin-bottom:6px">Items Created</div>
    <div style="font-size:26px;font-weight:700;font-family:'IBM Plex Mono',monospace" id="s-items">—</div>
  </div>
  <div class="card" style="padding:14px 18px">
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:#94a3b8;margin-bottom:6px">Last Import</div>
    <div style="font-size:20px;font-weight:700;font-family:'IBM Plex Mono',monospace" id="s-last">—</div>
  </div>
</div>

<!-- Table -->
<div class="table-wrap">
  <table>
    <thead><tr>
      <th>Date</th>
      <th>Vendor</th>
      <th>Reference</th>
      <th>Site</th>
      <th>Items</th>
      <th>Imported By</th>
      <th>Notes</th>
    </tr></thead>
    <tbody id="histBody"><tr><td colspan="7" style="text-align:center;padding:40px;color:#94a3b8">Loading…</td></tr></tbody>
  </table>
</div>
<div id="pagination" style="margin-top:12px;display:flex;gap:4px;align-items:center;flex-wrap:wrap"></div>

</div>

<style>
@media print {
  .sidebar,.topbar-right{display:none!important}
  .topbar{border:none}
  .card{border:1px solid #ccc!important;break-inside:avoid}
}
</style>
<script>
let _deb=null, currentPage=1;
function loadDebounced(){clearTimeout(_deb);_deb=setTimeout(()=>load(1),350);}

async function load(page){
  if(page)currentPage=page;
  const params=new URLSearchParams({
    vendor: document.getElementById('f-vendor').value,
    site:   document.getElementById('f-site').value,
    from:   document.getElementById('f-from').value,
    to:     document.getElementById('f-to').value,
    page:   currentPage
  });
  const data=await fetch('/api/import-history?'+params).then(r=>r.json());
  if(!data.ok)return;
  renderStats(data);
  renderTable(data.rows, data.total, data.page, data.pages);
}

function renderStats(data){
  document.getElementById('s-total').textContent=data.total;
  document.getElementById('s-items').textContent=data.total_items;
  if(data.rows&&data.rows.length){
    const d=data.rows[0].imported_at||'';
    document.getElementById('s-last').textContent=d.substring(0,10)||'—';
  } else {
    document.getElementById('s-last').textContent='—';
  }
}

function renderTable(rows, total, page, pages){
  const tb=document.getElementById('histBody');
  if(!rows.length){
    tb.innerHTML='<tr><td colspan="7" style="text-align:center;padding:40px;color:#94a3b8">No imports found.</td></tr>';
    renderPagination(total, page, pages);
    return;
  }
  tb.innerHTML=rows.map(r=>`<tr>
    <td style="font-family:'IBM Plex Mono',monospace;font-size:12px;white-space:nowrap">${esc(r.imported_at?.substring(0,16)||'—')}</td>
    <td style="font-weight:500">${esc(r.vendor||'—')}</td>
    <td style="font-size:12px;color:#64748b">${esc(r.reference||'—')}</td>
    <td>${esc(r.site_name||'—')}</td>
    <td style="font-family:'IBM Plex Mono',monospace;font-weight:600;text-align:center">${r.line_count??'—'}</td>
    <td style="font-size:12px;color:#64748b">${esc(r.imported_by||'—')}</td>
    <td style="font-size:12px;color:#64748b;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.notes||'')}">${esc(r.notes||'')}</td>
  </tr>`).join('');
  renderPagination(total, page, pages);
}

function renderPagination(total, page, pages){
  const el=document.getElementById('pagination');
  if(pages<=1){el.innerHTML='<span style="font-size:12px;color:#94a3b8">'+total+' record'+(total===1?'':'s')+'</span>';return;}
  let html=`<button class="btn btn-secondary btn-sm" ${page===1?'disabled':''} onclick="load(${page-1})">‹</button>`;
  for(let i=1;i<=pages;i++){
    if(pages>7&&Math.abs(i-page)>2&&i!==1&&i!==pages){if(i===2||i===pages-1)html+='<span style="padding:4px 6px;color:#94a3b8">…</span>';continue;}
    html+=`<button class="btn btn-sm ${i===page?'btn-primary':'btn-secondary'}" onclick="load(${i})">${i}</button>`;
  }
  html+=`<button class="btn btn-secondary btn-sm" ${page===pages?'disabled':''} onclick="load(${page+1})">›</button>`;
  html+=`<span style="font-size:12px;color:#94a3b8;margin-left:4px">${total} records · page ${page}/${pages}</span>`;
  el.innerHTML=html;
}

function clearFilters(){
  ['f-vendor','f-site','f-from','f-to'].forEach(id=>document.getElementById(id).value='');
  load(1);
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
load(1);
</script>
{% endblock %}
