{% extends "base.html" %}
{% block title %}To Do · CountDepot{% endblock %}
{% block content %}
<div class="topbar">
  <span class="topbar-title">To Do</span>
  <span class="topbar-sub" id="taskCount"></span>
  <div class="topbar-right">
    <button class="btn btn-primary" onclick="openAddTask()">+ Add Task</button>
  </div>
</div>
<div style="flex:1;overflow-y:auto;padding:20px 24px">
  <div class="kanban" id="kanban">
    <div class="kanban-col">
      <div class="kanban-hdr" style="border-color:#b91c1c"><span class="kanban-dot" style="background:#b91c1c"></span> To Do <span class="kanban-cnt" id="cnt-todo">0</span></div>
      <div class="kanban-body" id="col-todo"></div>
    </div>
    <div class="kanban-col">
      <div class="kanban-hdr" style="border-color:#d97706"><span class="kanban-dot" style="background:#d97706"></span> In Progress <span class="kanban-cnt" id="cnt-progress">0</span></div>
      <div class="kanban-body" id="col-progress"></div>
    </div>
    <div class="kanban-col">
      <div class="kanban-hdr" style="border-color:#15803d"><span class="kanban-dot" style="background:#15803d"></span> Done <span class="kanban-cnt" id="cnt-done">0</span></div>
      <div class="kanban-body" id="col-done"></div>
    </div>
  </div>
</div>

<!-- ADD/EDIT TASK MODAL -->
<div class="overlay" id="taskModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title" id="taskModalTitle">Add Task</div>
      <button class="modal-close" onclick="closeModal('taskModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="task-id">
      <div class="field"><label class="label">Task *</label><input class="input" id="task-title" placeholder="What needs to be done?"></div>
      <div style="display:flex;gap:10px">
        <div class="field" style="flex:1"><label class="label">Urgency</label>
          <select class="select" id="task-urgency">
            <option value="high">🔴 High</option>
            <option value="medium" selected>🟡 Medium</option>
            <option value="low">🟢 Low</option>
          </select>
        </div>
        <div class="field" style="flex:1"><label class="label">Status</label>
          <select class="select" id="task-status">
            <option value="todo">To Do</option>
            <option value="progress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </div>
      </div>
      <div class="field"><label class="label">Notes</label><textarea class="input" id="task-notes" rows="3" style="resize:vertical" placeholder="Optional details…"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('taskModal')">Cancel</button>
      <button class="btn btn-primary" id="taskSaveBtn" onclick="saveTask()">Add Task</button>
    </div>
  </div>
</div>

<style>
.kanban{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;min-height:400px}
.kanban-col{background:#f8f8f6;border-radius:10px;display:flex;flex-direction:column;min-height:200px}
.kanban-hdr{padding:12px 14px;font-size:13px;font-weight:700;border-top:3px solid;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:8px}
.kanban-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.kanban-cnt{font-size:11px;font-weight:500;color:#94a3b8;margin-left:auto}
.kanban-body{flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.task-card{background:#fff;border:1px solid #e5e3de;border-radius:8px;padding:10px 12px;cursor:pointer;transition:box-shadow .15s}
.task-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.task-title{font-size:13px;font-weight:600;line-height:1.4}
.task-meta{font-size:11px;color:#94a3b8;margin-top:4px;display:flex;align-items:center;gap:8px}
.urg-high{border-left:3px solid #b91c1c}
.urg-medium{border-left:3px solid #d97706}
.urg-low{border-left:3px solid #15803d}
.item-task{border-left:3px solid #1d4ed8;background:#fafcff}
.task-actions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.task-actions button{font-size:10px;padding:2px 8px}
@media(max-width:900px){.kanban{grid-template-columns:1fr}}
</style>
<script>
let allTasks=[];
function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}
function openAddTask(){
  document.getElementById('task-id').value='';
  document.getElementById('task-title').value='';
  document.getElementById('task-urgency').value='medium';
  document.getElementById('task-status').value='todo';
  document.getElementById('task-notes').value='';
  document.getElementById('taskModalTitle').textContent='Add Task';
  document.getElementById('taskSaveBtn').textContent='Add Task';
  openModal('taskModal');
  setTimeout(()=>document.getElementById('task-title').focus(),100);
}
function editTask(id){
  const t=allTasks.find(x=>x.id===id);if(!t)return;
  document.getElementById('task-id').value=t.id;
  document.getElementById('task-title').value=t.title;
  document.getElementById('task-urgency').value=t.urgency;
  document.getElementById('task-status').value=t.status;
  document.getElementById('task-notes').value=t.notes||'';
  document.getElementById('taskModalTitle').textContent='Edit Task';
  document.getElementById('taskSaveBtn').textContent='Save Changes';
  openModal('taskModal');
}
async function saveTask(){
  const id=document.getElementById('task-id').value;
  const payload={
    title:document.getElementById('task-title').value.trim(),
    urgency:document.getElementById('task-urgency').value,
    status:document.getElementById('task-status').value,
    notes:document.getElementById('task-notes').value.trim()
  };
  if(!payload.title){toast('Title required','warn');return;}
  let res;
  if(id){payload.id=parseInt(id);res=await api('/api/task/update',payload);}
  else{res=await api('/api/task/add',payload);}
  if(res.ok){toast(id?'Task updated ✓':'Task added ✓','ok');closeModal('taskModal');loadTasks();}
  else toast(res.msg||'Error','err');
}
async function moveTask(id,newStatus){
  const res=await api('/api/task/update',{id,status:newStatus});
  if(res.ok) loadTasks();
}
function renderCard(t){
  const urgLabel={high:'🔴',medium:'🟡',low:'🟢'}[t.urgency]||'';
  const isItemTask=!!t.item_id;
  const moves=[];
  if(t.status!=='todo') moves.push(`<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();moveTask(${t.id},'todo')">← To Do</button>`);
  if(t.status!=='progress') moves.push(`<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();moveTask(${t.id},'progress')">⟳ Progress</button>`);
  // Item-linked tasks can't be manually marked Done — only the system closes them when item is complete
  if(t.status!=='done'&&!isItemTask) moves.push(`<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();moveTask(${t.id},'done')">✓ Done</button>`);
  // No delete button for anyone — tasks must be completed not deleted
  const itemLink=isItemTask?`<a href="/?item=${t.item_id}" onclick="event.stopPropagation()" class="btn btn-secondary btn-sm" style="font-size:10px;background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe">→ View Item #${t.item_id}</a>`:'';
  const systemBadge=isItemTask?`<span style="font-size:9px;font-weight:700;background:#f0f7ff;color:#1d4ed8;border:1px solid #bfdbfe;padding:1px 6px;border-radius:4px;margin-left:4px">AUTO</span>`:'';
  return `<div class="task-card urg-${t.urgency}${isItemTask?' item-task':''}" onclick="${isItemTask?'':'editTask('+t.id+')'}">
    <div class="task-title">${t.title}${systemBadge}</div>
    ${t.notes?`<div style="font-size:11px;color:#666;margin-top:3px;line-height:1.4">${t.notes.substring(0,80)}${t.notes.length>80?'…':''}</div>`:''}
    <div class="task-meta">${urgLabel} ${t.urgency}${!isItemTask?' · '+(t.created_by||'—'):'·system'} · ${(t.created_at||'').substring(0,10)}</div>
    <div class="task-actions">${moves.join('')}${itemLink}</div>
  </div>`;
}
async function loadTasks(){
  allTasks=await fetch('/api/tasks').then(r=>r.json());
  const todo=allTasks.filter(t=>t.status==='todo');
  const progress=allTasks.filter(t=>t.status==='progress');
  const done=allTasks.filter(t=>t.status==='done');
  document.getElementById('col-todo').innerHTML=todo.map(renderCard).join('')||'<div style="color:#ccc;font-size:12px;text-align:center;padding:20px">No tasks</div>';
  document.getElementById('col-progress').innerHTML=progress.map(renderCard).join('')||'<div style="color:#ccc;font-size:12px;text-align:center;padding:20px">No tasks</div>';
  document.getElementById('col-done').innerHTML=done.map(renderCard).join('')||'<div style="color:#ccc;font-size:12px;text-align:center;padding:20px">No tasks</div>';
  document.getElementById('cnt-todo').textContent=todo.length;
  document.getElementById('cnt-progress').textContent=progress.length;
  document.getElementById('cnt-done').textContent=done.length;
  document.getElementById('taskCount').textContent=allTasks.length+' task'+(allTasks.length===1?'':'s');
}
loadTasks();
</script>
{% endblock %}
