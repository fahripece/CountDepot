{% extends "base.html" %}
{% block title %}Warranty & Contract Report · CountDepot{% endblock %}
{% block content %}
<div class="topbar">
  <span class="topbar-title">Warranty &amp; Contract Report</span>
  <span class="topbar-sub" id="topbar-sub">Items with expiring warranties and service contracts</span>
  <div class="topbar-right">
    <select id="horizonSel" class="select" style="width:auto" onchange="load()">
      <option value="30">Next 30 days</option>
      <option value="60">Next 60 days</option>
      <option value="90" selected>Next 90 days</option>
      <option value="180">Next 180 days</option>
      <option value="365">Next 12 months</option>
      <option value="9999">All expiring</option>
    </select>
    <a href="/api/report/warranties/pdf" class="btn btn-secondary btn-sm">↓ PDF</a>
    <button class="btn btn-secondary btn-sm" onclick="window.print()">🖨 Print</button>
    <button class="btn btn-secondary btn-sm" onclick="load()">↻ Refresh</button>
  </div>
</div>

<div style="flex:1;overflow-y:auto;padding:20px 24px" id="pageContent">
  <div style="text-align:center;padding:60px;color:#94a3b8">Loading…</div>
</div>

<style>
.wc-kpi{background:#fff;border:1px solid #e5e3de;border-radius:10px;padding:16px 20px;text-align:center}
.wc-kpi-v{font-size:28px;font-weight:700;color:#0f172a;line-height:1}
.wc-kpi-l{font-size:11px;color:#94a3b8;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.wc-table th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#94a3b8;font-weight:600;padding:8px 12px;border-bottom:2px solid #e5e3de;text-align:left;white-space:nowrap}
.wc-table td{padding:10px 12px;border-bottom:1px solid #f5f4f1;font-size:13px;vertical-align:middle}
.wc-table tr:last-child td{border-bottom:none}
.wc-table tr:hover td{background:#fafaf9}
.wc-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.wc-expired{background:#fef2f2;color:#991b1b}
.wc-soon{background:#fffbeb;color:#92400e}
.wc-ok{background:#f0fdf4;color:#15803d}
@media print{.sidebar,.topbar-right,#horizonSel{display:none!important}}
</style>
<script>
function daysBadge(days){
  if(days===null||days===undefined)return'—';
  if(days<0)return`<span class="wc-badge wc-expired">Expired ${Math.abs(days)}d ago</span>`;
  if(days<=30)return`<span class="wc-badge wc-soon">${days}d left</span>`;
  return`<span class="wc-badge wc-ok">${days}d left</span>`;
}
function fmtDate(d){return d?d.slice(0,10):'—';}

async function load(){
  const horizon=document.getElementById('horizonSel').value;
  const el=document.getElementById('pageContent');
  el.innerHTML='<div style="text-align:center;padding:60px;color:#94a3b8">Loading…</div>';
  const data=await fetch('/api/report/warranties?days='+horizon).then(r=>r.json()).catch(()=>({ok:false}));
  if(!data.ok){el.innerHTML='<div style="color:#b91c1c;padding:20px">Error loading data</div>';return;}

  const items=data.items;
  const expired=items.filter(i=>i.warranty_days_left<0||i.contract_days_left<0);
  const soon=items.filter(i=>(i.warranty_days_left>=0&&i.warranty_days_left<=30)||(i.contract_days_left>=0&&i.contract_days_left<=30));
  const ok=items.filter(i=>!expired.includes(i)&&!soon.includes(i));

  document.getElementById('topbar-sub').textContent=`${items.length} item(s) in next ${horizon==='9999'?'all time':horizon+' days'}`;

  let html=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
    <div class="wc-kpi"><div class="wc-kpi-v" style="color:#b91c1c">${expired.length}</div><div class="wc-kpi-l">Expired</div></div>
    <div class="wc-kpi"><div class="wc-kpi-v" style="color:#b45309">${soon.length}</div><div class="wc-kpi-l">Expiring &lt;30 days</div></div>
    <div class="wc-kpi"><div class="wc-kpi-v" style="color:#15803d">${ok.length}</div><div class="wc-kpi-l">OK</div></div>
    <div class="wc-kpi"><div class="wc-kpi-v">${items.length}</div><div class="wc-kpi-l">Total shown</div></div>
  </div>`;

  if(!items.length){
    html+='<div style="text-align:center;padding:40px;color:#94a3b8;font-size:14px">No items with warranty or contract expiry in this period.</div>';
    el.innerHTML=html;return;
  }

  html+=`<div style="background:#fff;border:1px solid #e5e3de;border-radius:10px;overflow:hidden">
  <table class="wc-table" style="width:100%;border-collapse:collapse">
    <thead><tr>
      <th>Item</th><th>Category</th><th>Serial / SKU</th><th>Location</th>
      <th>Warranty Expiry</th><th>Contract Expiry</th><th>Notes</th>
    </tr></thead>
    <tbody>`;
  items.forEach(i=>{
    const wCell=i.warranty_expiry?`${fmtDate(i.warranty_expiry)} ${daysBadge(i.warranty_days_left)}`:'—';
    const cCell=i.contract_expiry?`${fmtDate(i.contract_expiry)} ${daysBadge(i.contract_days_left)}`:'—';
    const id=i.serial||i.sku||i.internal_sku||('ID-'+i.id);
    html+=`<tr>
      <td style="font-weight:600">${i.name}</td>
      <td><span style="font-size:11px;color:#64748b">${i.category||'—'}</span></td>
      <td><span style="font-family:monospace;font-size:12px">${id}</span></td>
      <td>${i.shelf||'—'}</td>
      <td>${wCell}</td>
      <td>${cCell}</td>
      <td style="font-size:12px;color:#64748b">${i.warranty_notes||''}</td>
    </tr>`;
  });
  html+='</tbody></table></div>';
  el.innerHTML=html;
}
load();
</script>
{% endblock %}
