<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change Password · CountDepot</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#f8f7f4;display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px}
.card{background:#fff;border:1px solid #e5e3de;border-radius:12px;
  padding:36px 32px;width:100%;max-width:400px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.badge{display:inline-flex;align-items:center;gap:6px;background:#fef9c3;
  border:1px solid #fde047;color:#713f12;border-radius:6px;
  padding:6px 12px;font-size:12.5px;font-weight:500;margin-bottom:22px}
h1{font-size:20px;font-weight:700;color:#0f172a;margin-bottom:6px}
.sub{font-size:13.5px;color:#64748b;margin-bottom:28px;line-height:1.5}
.field{margin-bottom:18px}
label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;
  letter-spacing:.5px;color:#64748b;margin-bottom:6px}
input{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:7px;
  font-size:14px;outline:none;transition:border-color .15s;background:#fff;color:#0f172a}
input:focus{border-color:#1d4ed8;box-shadow:0 0 0 3px rgba(29,78,216,.08)}
.err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;
  border-radius:7px;padding:10px 12px;font-size:13px;margin-bottom:18px}
.rules{font-size:12px;color:#94a3b8;margin-top:5px}
button{width:100%;padding:11px;background:#1d4ed8;color:#fff;border:none;
  border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;
  transition:background .15s;margin-top:6px}
button:hover{background:#1e40af}
.logout{display:block;text-align:center;margin-top:16px;font-size:12.5px;
  color:#94a3b8;text-decoration:none}
.logout:hover{color:#64748b}
</style>
</head>
<body>
<div class="card">
  <div class="badge">⚠ Action required</div>
  <h1>Set a new password</h1>
  <div class="sub">Your account was created with a temporary password. Please set a new one before continuing.</div>

  {% if error %}
  <div class="err">{{ error }}</div>
  {% endif %}

  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field">
      <label>New password</label>
      <input type="password" name="new_password" autofocus required minlength="8">
      <div class="rules">Min 8 characters · at least one uppercase letter · at least one number or symbol</div>
    </div>
    <div class="field">
      <label>Confirm password</label>
      <input type="password" name="confirm_password" required placeholder="Repeat password">
    </div>
    <button type="submit">Set password and continue →</button>
  </form>
  <a href="/logout" class="logout">Sign out instead</a>
</div>
</body>
</html>
