<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platform Admin · CountDepot</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#0f172a;display:flex;align-items:center;justify-content:center;
  min-height:100vh;color:#f8fafc}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;
  padding:40px;width:100%;max-width:380px}
.logo{font-size:13px;font-weight:600;color:#64748b;text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:28px;text-align:center}
h1{font-size:20px;font-weight:600;margin-bottom:6px;text-align:center}
.sub{font-size:13px;color:#94a3b8;text-align:center;margin-bottom:28px}
label{display:block;font-size:12px;font-weight:600;color:#94a3b8;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
input[type=password]{width:100%;padding:10px 12px;background:#0f172a;
  border:1px solid #334155;border-radius:7px;color:#f8fafc;font-size:14px;
  outline:none;transition:border-color .15s}
input[type=password]:focus{border-color:#3b82f6}
.err{background:#450a0a;border:1px solid #7f1d1d;color:#fca5a5;
  border-radius:7px;padding:10px 12px;font-size:13px;margin-bottom:18px}
button{width:100%;margin-top:20px;padding:11px;background:#3b82f6;color:#fff;
  border:none;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;
  transition:background .15s}
button:hover{background:#2563eb}
.warn{margin-top:24px;font-size:11.5px;color:#475569;text-align:center;
  padding:10px;border-top:1px solid #1e293b}
</style>
</head>
<body>
<div class="card">
  <div class="logo">CountDepot Platform</div>
  <h1>Admin Access</h1>
  <div class="sub">Super-admin panel — tenant management</div>

  {% if error %}
  <div class="err">{{ error }}</div>
  {% endif %}

  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Password</label>
    <input type="password" name="password" autofocus placeholder="Platform admin password">
    <button type="submit">Sign In</button>
  </form>

  <div class="warn">
    This panel is separate from tenant accounts.<br>
    Set <code>PLATFORM_ADMIN_PASSWORD</code> in your environment.
  </div>
</div>
</body>
</html>
