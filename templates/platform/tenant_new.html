<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Tenant · CountDepot Platform</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#0f172a;color:#f8fafc;display:flex;align-items:center;
  justify-content:center;min-height:100vh}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;
  padding:32px;width:100%;max-width:460px}
h1{font-size:18px;font-weight:600;margin-bottom:4px}
.sub{font-size:13px;color:#94a3b8;margin-bottom:24px}
.field{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;
  letter-spacing:.5px;color:#94a3b8;margin-bottom:6px}
input,select{width:100%;padding:9px 12px;background:#0f172a;
  border:1px solid #334155;border-radius:7px;color:#f8fafc;font-size:13px;
  outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:#3b82f6}
.hint{font-size:11.5px;color:#475569;margin-top:4px}
.err{background:#450a0a;border:1px solid #7f1d1d;color:#fca5a5;
  border-radius:7px;padding:9px 12px;font-size:13px;margin-bottom:18px}
.actions{display:flex;gap:10px;margin-top:22px}
.btn{padding:10px 18px;border-radius:7px;font-size:13px;font-weight:600;
  cursor:pointer;border:none;text-decoration:none}
.btn-primary{background:#3b82f6;color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-muted{background:#1e293b;color:#94a3b8;border:1px solid #334155}
.btn-muted:hover{background:#334155}
</style>
</head>
<body>
<div class="card">
  <h1>New Tenant</h1>
  <div class="sub">Creates a new isolated tenant database.</div>

  {% if error %}
  <div class="err">{{ error }}</div>
  {% endif %}

  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field">
      <label>Company name</label>
      <input name="name" placeholder="e.g. Acme Corp" required autofocus oninput="suggestSlug(this.value)">
    </div>
    <div class="field">
      <label>Slug</label>
      <input name="slug" id="slug-input" placeholder="e.g. acme" pattern="[a-z0-9\-]{2,32}" required
             style="font-family:'IBM Plex Mono',monospace">
      <div class="hint" id="slug-hint">Becomes the subdomain: slug.yourdomain.com</div>
    </div>
    <div class="field">
      <label>Plan</label>
      <select name="plan">
        <option value="standard">Standard</option>
        <option value="pro">Pro</option>
        <option value="healthcare">Healthcare</option>
      </select>
    </div>
    <div class="field">
      <label>Admin password</label>
      <input name="admin_password" type="password" placeholder="Min 8 characters" required minlength="8">
      <div class="hint">Tenant's admin account will use username <strong>admin</strong> with this password.</div>
    </div>
    <div class="actions">
      <a href="{{ url_for('platform.dashboard') }}" class="btn btn-muted">Cancel</a>
      <button type="submit" class="btn btn-primary">Create Tenant</button>
    </div>
  </form>
</div>
<script>
function suggestSlug(name){
  const slug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,32);
  const el=document.getElementById('slug-input');
  if(!el.dataset.touched) el.value=slug;
  document.getElementById('slug-hint').textContent=
    slug ? 'URL: '+slug+'.yourdomain.com' : 'Becomes the subdomain: slug.yourdomain.com';
}
document.getElementById('slug-input').addEventListener('input',function(){
  this.dataset.touched='1';
});
</script>
</body>
</html>
