<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify Login · CountDepot</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:#f0efec;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border:1px solid #e5e3de;border-radius:12px;padding:36px 32px;max-width:400px;width:100%;text-align:center}
h1{font-size:20px;font-weight:700;margin-bottom:8px;color:#0f172a}
p{font-size:13px;color:#64748b;margin-bottom:24px;line-height:1.6}
input{width:100%;padding:14px;border:2px solid #e5e3de;border-radius:8px;font-size:28px;font-family:'IBM Plex Mono',monospace;letter-spacing:12px;text-align:center;outline:none;margin-bottom:16px;transition:border .15s}
input:focus{border-color:#1d4ed8}
button{width:100%;padding:12px;background:#0f172a;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
button:hover{background:#1d4ed8}
.err{background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:10px 14px;font-size:13px;color:#b91c1c;margin-bottom:16px}
.back{display:block;margin-top:16px;font-size:12px;color:#94a3b8;text-decoration:none}
.back:hover{color:#64748b}
</style>
</head>
<body>
<div class="box">
  <div style="font-size:32px;margin-bottom:16px">🔐</div>
  <h1>Two-factor verification</h1>
  <p>We sent a 6-digit code to your email address.<br>Enter it below to continue.</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="text" name="otp" maxlength="6" pattern="\d{6}" inputmode="numeric"
           autofocus autocomplete="one-time-code" placeholder="000000"
           style="margin-bottom:20px">
    <button type="submit">Verify →</button>
  </form>
  <a href="/login" class="back">← Back to login</a>
</div>
</body>
</html>
