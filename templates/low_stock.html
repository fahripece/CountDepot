{% extends "base.html" %}
{% block title %}Low Stock · CountDepot{% endblock %}
{% block content %}
<div class="topbar">
  <span class="topbar-title">Low Stock</span>
  <span class="topbar-sub" id="ls-count" style="margin-left:6px"></span>
  <div style="position:relative;flex:1;max-width:300px;margin-left:8px">
    <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:#aaa;pointer-events:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="lsSearch" class="input" style="padding-left:30px" oninput="filterCards()" placeholder="Search products…">
  </div>
  <div class="topbar-right">
    <div style="display:flex;gap:6px;align-items:center">
      <button class="ls-filter-btn active" data-filter="all" onclick="setFilter('all',this)">All</button>
      <button class="ls-filter-btn" data-filter="red" onclick="setFilter('red',this)">🔴 Critical</button>
      <button class="ls-filter-btn" data-filter="yellow" onclick="setFilter('yellow',this)">🟡 Low</button>
      <button class="ls-filter-btn" data-filter="green" onclick="setFilter('green',this)">🟢 Healthy</button>
    </div>
    <button class="btn btn-secondary btn-sm" onclick="loadData()">↻ Refresh</button>
    <a href="/products" class="btn btn-secondary btn-sm">Manage Products</a>
  </div>
</div>

<div style="flex:1;overflow-y:auto;padding:20px 22px">
  <!-- Legend -->
  <div style="display:flex;gap:16px;margin-bottom:16px;font-size:12px;color:#64748b;align-items:center;flex-wrap:wrap">
    <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:50%;background:#b91c1c;display:inline-block"></span> <strong>Critical</strong> — at or below minimum</span>
    <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:50%;background:#d97706;display:inline-block"></span> <strong>Low</strong> — within 50% of minimum</span>
    <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:50%;background:#15803d;display:inline-block"></span> <strong>Healthy</strong> — above threshold</span>
  </div>
  <div id="ls-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px"></div>
</div>

<style>
.ls-filter-btn{padding:5px 12px;border-radius:6px;border:1px solid #e5e3de;background:#fff;font-size:12px;font-weight:500;cursor:pointer;transition:all .12s;color:#475569}
.ls-filter-btn:hover{border-color:#94a3b8;color:#0f172a}
.ls-filter-btn.active{background:#0f172a;color:#fff;border-color:#0f172a}
.ls-card{background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,border-color .15s;border:1.5px solid #e5e3de}
.ls-card:hover{box-shadow:0 4px 18px rgba(0,0,0,.08)}
.ls-card-top{padding:14px 16px 12px;display:flex;align-items:flex-start;gap:10px}
.ls-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
.ls-card-body{padding:0 16px 14px;flex:1}
.ls-card-foot{padding:12px 16px;border-top:1px solid #f5f4f1;display:flex;align-items:center;justify-content:space-between}
.ls-stat{text-align:center}
.ls-stat-label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#94a3b8;margin-bottom:3px}
.ls-stat-val{font-size:22px;font-weight:700;font-family:'IBM Plex Mono',monospace;letter-spacing:-1px;line-height:1}
.ls-bar-wrap{height:6px;background:#f0efec;border-radius:4px;overflow:hidden;margin-top:10px}
.ls-bar{height:100%;border-radius:4px;transition:width .4s}
/* Status border colors */
.ls-card.status-red{border-color:#fecaca}
.ls-card.status-yellow{border-color:#fde68a}
.ls-card.status-green{border-color:#bbf7d0}
.ls-card.status-red .ls-card-top{background:#fef2f2}
.ls-card.status-yellow .ls-card-top{background:#fffbeb}
.ls-card.status-green .ls-card-top{background:#f0fdf4}
</style>

<script>
let allData=[], currentFilter='all';

async function loadData(){
  document.getElementById('ls-grid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:60px;color:#94a3b8">Loading…</div>';
  allData=await fetch('/api/low-stock').then(r=>r.json());
  filterCards();
}

function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.ls-filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  filterCards();
}

function filterCards(){
  const q=document.getElementById('lsSearch').value.trim().toLowerCase();
  let items=allData;
  if(currentFilter!=='all') items=items.filter(p=>p.status===currentFilter);
  if(q) items=items.filter(p=>[p.name,p.manufacturer,p.model,p.category_name].filter(Boolean).some(v=>v.toLowerCase().includes(q)));
  renderGrid(items);
}

function renderGrid(items){
  const grid=document.getElementById('ls-grid');
  // Count by status for topbar
  const total=allData.length;
  const red=allData.filter(p=>p.status==='red').length;
  const yellow=allData.filter(p=>p.status==='yellow').length;
  const green=allData.filter(p=>p.status==='green').length;
  document.getElementById('ls-count').textContent=
    `${total} product${total!==1?'s':''} tracked · 🔴 ${red} critical · 🟡 ${yellow} low · 🟢 ${green} healthy`;

  if(!items.length){
    grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:#94a3b8">
      <div style="font-size:32px;margin-bottom:12px">✅</div>
      <div style="font-size:15px;font-weight:600;color:#374151;margin-bottom:4px">${currentFilter==='all'?'No tracked products yet':'No products in this category'}</div>
      <div style="font-size:13px">${currentFilter==='all'?'Set a minimum stock threshold on a product to track it here.':'Try a different filter.'}</div>
    </div>`;
    return;
  }

  grid.innerHTML=items.map(p=>{
    const catColor=p.category_color||'#6b7280';
    const catName=p.category_name||'—';
    const avail=p.available_count;
    const thresh=p.low_stock_threshold;
    const missing=p.missing;
    const pct=Math.min(Math.round((avail/thresh)*100),100);

    // Colors by status
    const statusColors={
      red:{bar:'#b91c1c',val:'#b91c1c',missingBg:'#fef2f2',missingBorder:'#fecaca',missingText:'#b91c1c',label:'Critical'},
      yellow:{bar:'#d97706',val:'#d97706',missingBg:'#fffbeb',missingBorder:'#fde68a',missingText:'#d97706',label:'Low'},
      green:{bar:'#15803d',val:'#15803d',missingBg:'#f0fdf4',missingBorder:'#bbf7d0',missingText:'#15803d',label:'Healthy'},
    };
    const sc=statusColors[p.status];

    return `<div class="ls-card status-${p.status}">
      <div class="ls-card-top">
        <div class="ls-icon" style="background:${catColor}">${catName[0]?.toUpperCase()||'?'}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px;color:#0f172a;line-height:1.3">${p.name}</div>
          <div style="font-size:11.5px;color:#94a3b8;font-family:'IBM Plex Mono',monospace;margin-top:2px">${[p.manufacturer,p.model].filter(Boolean).join(' · ')||'—'}</div>
        </div>
        <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:12px;background:${sc.missingBg};color:${sc.missingText};border:1px solid ${sc.missingBorder};white-space:nowrap">${sc.label}</span>
      </div>
      <div class="ls-card-body">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px">
          <span class="tag" style="background:${catColor}18;color:${catColor}">${catName}</span>
        </div>
        <!-- Stock bar -->
        <div class="ls-bar-wrap">
          <div class="ls-bar" style="width:${pct}%;background:${sc.bar}"></div>
        </div>
        <!-- Stats row -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px">
          <div class="ls-stat">
            <div class="ls-stat-label">Have</div>
            <div class="ls-stat-val" style="color:${sc.val}">${avail}</div>
          </div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          <div class="ls-stat">
            <div class="ls-stat-label">Minimum</div>
            <div class="ls-stat-val" style="color:#0f172a">${thresh}</div>
          </div>
          <div class="ls-stat" style="background:${sc.missingBg};border:1px solid ${sc.missingBorder};border-radius:8px;padding:6px 14px">
            <div class="ls-stat-label" style="color:${sc.missingText}">Short</div>
            <div class="ls-stat-val" style="color:${missing===0?'#15803d':sc.val}">${missing===0?'✓':missing}</div>
          </div>
        </div>
      </div>
      <div class="ls-card-foot">
        <span style="font-size:11.5px;color:#94a3b8">${avail} available · min ${thresh}</span>
        <a href="/add-item?product_id=${p.id}" class="btn btn-secondary btn-sm" style="font-size:11px">+ Add Stock</a>
      </div>
    </div>`;
  }).join('');
}

loadData();
</script>
{% endblock %}
