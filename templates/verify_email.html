<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify Email · CountDepot</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#f8f7f4;display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px}
.card{background:#fff;border:1px solid #e5e3de;border-radius:12px;
  padding:36px 32px;width:100%;max-width:400px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
h1{font-size:20px;font-weight:700;color:#0f172a;margin-bottom:6px}
.sub{font-size:13.5px;color:#64748b;margin-bottom:24px;line-height:1.55}
.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;
  border-radius:8px;padding:14px 16px;font-size:13.5px;line-height:1.55;margin-bottom:20px}
.bad{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;
  padding:14px 16px;margin-bottom:20px}
.bad h1{color:#b91c1c;margin-bottom:6px}
.bad p{font-size:13.5px;color:#64748b}
a.btn{display:block;padding:11px;background:#1d4ed8;color:#fff;border-radius:7px;
  text-align:center;text-decoration:none;font-weight:600;font-size:14px;
  transition:background .15s}
a.btn:hover{background:#1e40af}
.back{display:block;text-align:center;margin-top:16px;font-size:12.5px;
  color:#94a3b8;text-decoration:none}
.back:hover{color:#64748b}
</style>
</head>
<body>
<div class="card">

{% if invalid %}
  <div class="bad">
    <h1>Link expired</h1>
    <p>This verification link is invalid or has already been used. Links expire after 48 hours.</p>
  </div>
  <a href="/login" class="btn">Back to sign in</a>

{% elif success %}
  <h1>Email verified</h1>
  <div class="ok">Your email address has been confirmed. You can now sign in to your workspace.</div>
  <a href="/login" class="btn">Sign in →</a>

{% endif %}

  <a href="/login" class="back">← Back to sign in</a>
</div>
</body>
</html>
